<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Inside one circle: one voice, however many members</title>
  <desc id="d">Two sets of nested rings. On the left the star family: Vimshottari at the centre, the one conditional dasha that applies around it, tie-breakers outside. On the right the sign family: Narayana at the centre, Chara drawn as the same ring, purpose dashas around it. Each set counts as one voice.</desc>
  <rect width="640" height="360" fill="#ffffff"/>
  <g stroke-width="2" fill-opacity="0.30">
    <circle cx="170" cy="180" r="140" fill="#dbe8fb" stroke="#2f5fa8" stroke-dasharray="6 5"/>
    <circle cx="170" cy="180" r="98" fill="#b7d0f7" stroke="#2f5fa8"/>
    <circle cx="170" cy="180" r="54" fill="#8fb8ff" stroke="#2f5fa8"/>
    <circle cx="470" cy="180" r="140" fill="#d7f0e5" stroke="#1f7a5a" stroke-dasharray="6 5"/>
    <circle cx="470" cy="180" r="98" fill="#b4e6cf" stroke="#1f7a5a"/>
    <circle cx="470" cy="180" r="54" fill="#8fe0bd" stroke="#1f7a5a"/>
  </g>
  <g text-anchor="middle" fill="#12284a">
    <text x="170" y="176" font-size="14" font-weight="700">Vimshottari</text>
    <text x="170" y="194" font-size="11">leads</text>
    <text x="170" y="110" font-size="12" font-weight="600">the one conditional</text>
    <text x="170" y="125" font-size="11">that applies: confirms</text>
    <text x="170" y="62" font-size="12">Yogini and others: tie-break only</text>
    <text x="170" y="345" font-size="13" font-weight="700">Star family = ONE voice</text>
  </g>
  <g text-anchor="middle" fill="#10382b">
    <text x="470" y="170" font-size="14" font-weight="700">Narayana</text>
    <text x="470" y="187" font-size="11">= Chara for a</text>
    <text x="470" y="201" font-size="11">movable lagna</text>
    <text x="470" y="110" font-size="12" font-weight="600">purpose dashas</text>
    <text x="470" y="125" font-size="11">Sudasa, Drig, divisional Narayana</text>
    <text x="470" y="62" font-size="12">join only for their subject</text>
    <text x="470" y="345" font-size="13" font-weight="700">Sign family = ONE voice</text>
  </g>
</svg>

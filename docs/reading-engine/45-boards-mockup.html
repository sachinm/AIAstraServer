<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI AdAstra Boards Mockup</title>
<style>
:root{
  color-scheme:dark;
  --page:#06051a;--bg:#0b0a1f;--surface:#15142e;--line:#2b2a52;--text:#f2f1fc;--muted:#b4b2d4;
  --brand:#b9a6ff;--brand-soft:rgba(185,166,255,.16);
  --teal:#4fd1c0;--teal-soft:rgba(79,209,192,.15);
  --rose:#f58bb3;--rose-soft:rgba(245,139,179,.15);
  --gold:#ecc04f;--gold-soft:rgba(236,192,79,.15);
  --g1:#a78bfa;--g2:#f472b6;--btn1:#6d28d9;--btn2:#be185d;
  --scr-support:#0a1224;--sf-support:#131d36;--ln-support:#2a3858;
  --scr-over:#0b0a1f;--sf-over:#15142e;--ln-over:#2b2a52;
  --scr-opp:#170e1b;--sf-opp:#261728;--ln-opp:#4d3248;
  --shadow:0 12px 48px rgba(0,0,0,.55);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --page:#e7e6f2;--bg:#f6f5fc;--surface:#ffffff;--line:#d8d6ee;--text:#16152e;--muted:#4f4d74;
    --brand:#5b21b6;--brand-soft:rgba(91,33,182,.1);
    --teal:#0a7a6d;--teal-soft:rgba(10,122,109,.1);
    --rose:#b0306a;--rose-soft:rgba(176,48,106,.1);
    --gold:#7f5800;--gold-soft:rgba(127,88,0,.12);
    --g1:#6d28d9;--g2:#be185d;
    --scr-support:#eef3f8;--sf-support:#ffffff;--ln-support:#cfdae6;
    --scr-over:#f6f5fc;--sf-over:#ffffff;--ln-over:#d8d6ee;
    --scr-opp:#fff5ea;--sf-opp:#fffdf9;--ln-opp:#efd6ba;
    --shadow:0 12px 48px rgba(40,30,90,.18);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#e7e6f2;--bg:#f6f5fc;--surface:#ffffff;--line:#d8d6ee;--text:#16152e;--muted:#4f4d74;
  --brand:#5b21b6;--brand-soft:rgba(91,33,182,.1);
  --teal:#0a7a6d;--teal-soft:rgba(10,122,109,.1);
  --rose:#b0306a;--rose-soft:rgba(176,48,106,.1);
  --gold:#7f5800;--gold-soft:rgba(127,88,0,.12);
  --g1:#6d28d9;--g2:#be185d;
  --scr-support:#eef3f8;--sf-support:#ffffff;--ln-support:#cfdae6;
  --scr-over:#f6f5fc;--sf-over:#ffffff;--ln-over:#d8d6ee;
  --scr-opp:#fff5ea;--sf-opp:#fffdf9;--ln-opp:#efd6ba;
  --shadow:0 12px 48px rgba(40,30,90,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
h1,h2,h3,h4,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
svg{display:block;flex:none}
:focus-visible{outline:3px solid var(--accent,var(--brand));outline-offset:2px;border-radius:8px}

/* board accents */
.b-you{--accent:var(--teal);--accent-soft:var(--teal-soft)}
.b-love{--accent:var(--rose);--accent-soft:var(--rose-soft)}
.b-work{--accent:var(--gold);--accent-soft:var(--gold-soft)}
.b-none{--accent:var(--brand);--accent-soft:var(--brand-soft)}

/* stage and frame */
.stage{min-height:100vh;display:grid;grid-template-columns:minmax(220px,280px) minmax(0,420px);justify-content:center;gap:24px;padding:16px;align-items:start}
.phone{grid-column:2;grid-row:1;position:relative;display:flex;flex-direction:column;height:min(880px,calc(100vh - 32px));min-height:560px;background:var(--bg);border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:var(--shadow)}
.mock{grid-column:1;grid-row:1;position:sticky;top:16px}
@media (max-width:760px){
  .stage{display:block;padding:0}
  .phone{max-width:420px;width:100%;margin:0 auto;height:100vh;height:100dvh;border-radius:0;border:0;box-shadow:none}
  .mock{position:static;max-width:420px;margin:0 auto;padding:16px}
}

.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px 28px;background:var(--scr);color:var(--text);--scr:var(--scr-over);--surface:var(--sf-over);--line:var(--ln-over)}
.screen.lay-support{--scr:var(--scr-support);--surface:var(--sf-support);--line:var(--ln-support);font-size:18px;line-height:1.6}
.screen.lay-opportunity{--scr:var(--scr-opp);--surface:var(--sf-opp);--line:var(--ln-opp)}
.screen:focus{outline:none}
.enter{animation:fade .25s ease both}
.lay-support .enter{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.over{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.title{font-size:36px;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--text)}
@supports (-webkit-background-clip:text) or (background-clip:text){
  .title{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
}
.tools{display:flex;gap:6px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.iconbtn.plain{border-color:transparent;background:none}

/* segmented control */
.seg{display:grid;grid-template-columns:.72fr 1.45fr .85fr 1fr;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.seg button{min-height:44px;border-radius:11px;font-size:15px;font-weight:600;color:var(--muted);padding:0 4px;white-space:nowrap;text-align:center}
.seg button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:800;box-shadow:inset 0 -3px 0 var(--accent)}

/* layout rhythm */
.stack{display:flex;flex-direction:column;gap:14px}
.lay-support .stack{gap:22px}
.lay-opportunity .stack{gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.lay-support .card{padding:20px}
.card.soft{background:transparent;border-style:dashed}
.k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.meta{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)}
.big{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.sub-h{font-size:19px;font-weight:700;margin-bottom:4px}

/* tone head */
.tonechip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700;font-size:15px}
.tonechip.sm{font-size:14px;padding:3px 10px 3px 7px}
.headline{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.01em;margin:14px 0 8px}
.lay-opportunity .headline{font-size:36px;line-height:1.1;letter-spacing:-.02em}
.lede{font-size:1.1em}

/* lists */
.list li{display:flex;gap:10px;padding:7px 0;align-items:flex-start}
.list li svg{margin-top:4px;color:var(--accent)}
.lay-support .list li{padding:9px 0}
.pair{display:grid;gap:14px}
.lay-support .pair{gap:22px}
.hd{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px;font-size:1.02em}
.hd svg{color:var(--accent)}

/* rows and buttons */
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.rowbtn:last-child{border-bottom:0}
.rowbtn .rcol{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.rowbtn .rq{font-weight:600}
.rowbtn>svg{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--text);background:transparent}
.chip svg{color:var(--accent)}
.btn-primary{min-height:48px;padding:0 22px;border-radius:14px;background:linear-gradient(90deg,var(--btn1),var(--btn2));color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-primary[aria-pressed="true"]{background:var(--surface);color:var(--text);border:1.5px solid var(--accent)}
.btn-ghost{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-ghost[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:800}
.linkbtn{min-height:44px;display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.backbtn{min-height:44px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);margin-left:-6px;padding:0 8px 0 2px}

/* now-to-next, bars */
.steps{display:flex;align-items:stretch;gap:10px;margin:6px 0 8px}
.st{flex:1}
.st b{display:flex;align-items:center;gap:8px}
.st .dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);flex:none}
.st.now .dot{background:var(--accent)}
.stline{align-self:center;flex:0 0 28px;height:3px;border-radius:2px;background:var(--line)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px}
.hero{border:2px solid var(--accent);background:var(--surface)}
.herodate{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em}

details.card summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:24px;color:var(--accent);font-weight:400}
details.card[open] summary::after{content:"\2212"}
details.card[open] summary{margin-bottom:6px}

/* rung */
.rung h3{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:var(--muted);font-weight:700;margin-bottom:8px}
.rung .sent{font-size:1.08em;font-weight:700;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95em}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{font-weight:600}
.rung.hidden{border-style:dashed;background:transparent}

/* looking back */
.rangecard{display:flex;flex-direction:column;gap:6px}
.q{font-size:1.06em;font-weight:600;margin-bottom:12px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notechips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.notechips .btn-ghost{min-height:44px;font-size:15px}
.confirmed{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1em}
.confirmed svg{color:var(--accent)}

/* today */
.lead{font-size:22px;line-height:1.3;font-weight:700}
.bcard{display:block;position:relative;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:14px 44px 14px 16px;min-height:44px}
.bcard .bc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.bname{font-weight:800;color:var(--accent);font-size:17px}
.bc-sent{font-size:1.02em;font-weight:600;margin-bottom:4px}
.bc-date{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px}
.bcard .chev{position:absolute;right:14px;top:50%;margin-top:-10px;color:var(--muted)}
.changed{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--brand);background:var(--brand-soft)}
.askbar{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--muted);text-align:left}

/* ask */
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bubble{max-width:88%;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.bubble.me{align-self:flex-end;background:var(--brand-soft);border-color:var(--brand)}
.askform{position:sticky;bottom:-14px;display:flex;gap:8px;padding:10px 0 4px;background:var(--scr)}
.askform input{flex:1;min-width:0;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px}
.askform .btn-primary{width:48px;padding:0}
.sugg{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sugg .btn-ghost{justify-content:flex-start;text-align:left;min-height:48px}

/* chart details (exempt block) */
.chartd{border:1.5px dashed var(--accent)}
.chartd dl{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.chartd dt{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chartd dd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.45}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg)}
.tab{position:relative;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600;padding:6px 2px;text-align:center}
.tab[aria-current="page"]{color:var(--accent);font-weight:800}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* overlay: sheets */
.overlay{position:absolute;inset:0;z-index:20;pointer-events:none}
.overlay.on{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(5,4,20,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;animation:slide .26s ease both}
.nomo .sheet,.nomo .backdrop{animation:none}
@keyframes slide{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 4px 20px}
.sh-head h2{font-size:22px;font-weight:800}
.sh-body{overflow-y:auto;padding:4px 20px 28px}
.sh-body p+p,.sh-body p+ul,.sh-body ul+p{margin-top:12px}
.sh-body .list li svg{color:var(--brand)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px}
.switch{min-width:76px;min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.switch[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.switch .knob{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--muted)}
.switch[aria-checked="true"] .knob{background:var(--brand);border-color:var(--brand)}

/* mockup-only panel */
.mock details{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.mock summary{min-height:48px;padding:0 16px;display:flex;align-items:center;font-weight:800;cursor:pointer}
.mock .mbody{padding:0 16px 16px}
.mrow{margin-top:14px}
.mlabel{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:15px;font-weight:600}
.mchip[aria-checked="true"]{border:2px solid var(--brand);background:var(--brand-soft);font-weight:800}
.mchip[aria-checked="true"]::before{content:"\2713\00a0"}
.mnote{font-size:14px;color:var(--muted);margin-top:12px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="stage">
  <main class="phone" id="phone" aria-label="App mockup">
    <div class="screen" id="screen" tabindex="-1"></div>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div class="overlay" id="overlay"></div>
  </main>
  <aside class="mock" aria-label="Mockup controls">
    <details id="mockd" open>
      <summary>Mockup only</summary>
      <div class="mbody" id="mockbody"></div>
    </details>
  </aside>
</div>
<script>
(function(){
'use strict';

/* ---------- dates (today is fixed for the mockup: Thursday 5 Nov 2026) ---------- */
var TODAY_ISO='2026-11-05';
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WEEKDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function pd(iso){var p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function iso(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function plus(i,n){var t=pd(i);t.setDate(t.getDate()+n);return iso(t);}
function f(i){var t=pd(i);return t.getDate()+' '+MONTHS[t.getMonth()];}
function fy(i){var t=pd(i);return f(i)+(t.getFullYear()!==2026?' '+t.getFullYear():'');}
function days(i){return Math.round((pd(i)-pd(TODAY_ISO))/864e5);}
function daysText(i){var n=days(i);return n===1?'1 day':n+' days';}
function inWhen(i){var n=days(i);if(n<14)return 'in '+daysText(i);return 'in about '+Math.round(n/7)+' weeks';}
function wdDate(i){var t=pd(i);return WEEKDAYS[t.getDay()]+' '+f(i);}

/* ---------- icons ---------- */
var P={
  today:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  you:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  love:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  work:'<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  ask:'<path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>',
  demanding:'<path d="M3 19L9 8l4 6 3-4 5 9z"/>',
  easing:'<path d="M3 7c6 0 7 10 18 10"/><path d="M17 13l4 4-4 0"/>',
  steady:'<path d="M4 9h16M4 15h16"/>',
  open:'<path d="M5 20V11a7 7 0 0 1 14 0v9"/><path d="M9 20v-6a3 3 0 0 1 6 0v6"/>',
  closing:'<path d="M7 4h10M7 20h10M8 4c0 5 4 5 4 8s-4 3-4 8M16 4c0 5-4 5-4 8s4 3 4 8"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  okc:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l3 3 5-6"/>',
  wait:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  none:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/>',
  pause:'<path d="M9 5v14M15 5v14"/>',
  theme:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  send:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.5v.5"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
function ic(n,s){s=s||20;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+P[n]+'</svg>';}

/* ---------- boards, tones ---------- */
var BOARD_ORDER=['you','love','work'];

function sub(str,b,yr){
  var D=BOARDS[b].d,ff=yr?fy:f,B=BOARDS[b];
  return str.replace(/\{(E|O|C|OP)\}/g,function(m,k){return ff(D[k]);})
    .replace(/\{C1\}/g,ff(plus(D.C,1))).replace(/\{OP1\}/g,ff(plus(D.OP,1)))
    .replace(/\{a\}/g,B.area).replace(/\{mv\}/g,B.mv).replace(/\{area\}/g,B.areaNoun);
}

function applyTheme(){
  var r=document.documentElement;
  if(S.themePref==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.themePref);
  try{if(S.themePref==='auto')localStorage.removeItem('boards-theme');else localStorage.setItem('boards-theme',S.themePref);}catch(e){}
}
function C(b){return COPY[b][S.tone[b]];}
function fullLine(b,t){var c=COPY[b][t||S.tone[b]];return c.h+' '+sub(c.n,b);}
function listHTML(items,b,icon){return '<ul class="list">'+items.map(function(s){return '<li>'+ic(icon||'check',18)+'<span>'+sub(s,b)+'</span></li>';}).join('')+'</ul>';}
function toneChip(t,small){return '<span class="tonechip'+(small?' sm':'')+'">'+ic(t,small?16:18)+TONES[t].label+'</span>';}
function actDays(end){
  var out=[plus(TODAY_ISO,2),plus(TODAY_ISO,9),plus(end,-3)];
  return out.filter(function(d,i){return days(d)>0&&days(d)<days(end)&&out.indexOf(d)===i;});
}

/* ---------- views ---------- */
function topBar(title,over){
  var dark=effDark();
  return '<header class="top"><div><p class="over">'+over+'</p><h1 class="title">'+title+'</h1></div><div class="tools">'+
   '<button class="iconbtn" data-act="theme" aria-label="'+(dark?'Switch to light theme':'Switch to dark theme')+'">'+ic('theme',20)+'</button>'+
   '<button class="iconbtn" data-act="settings" aria-label="Settings">'+ic('you',20)+'</button></div></header>';
}

function todayView(){
  var lead=BOARD_ORDER.slice().sort(function(a,b){return TONES[S.tone[b]].rank-TONES[S.tone[a]].rank;})[0];
  var h=topBar('Today','Thursday 5 Nov');
  h+='<div class="stack">';
  h+='<section class="card b-none" aria-labelledby="fy"><p class="k" id="fy">For you today</p><p class="lead">'+fullLine(lead)+'</p><p class="meta" style="margin-top:8px">From your '+BOARDS[lead].name+' board</p></section>';
  if(S.changed){
    var ch=S.changed;
    h+='<section class="card changed b-none" role="status"><span style="color:var(--brand)">'+ic('info',22)+'</span><div style="flex:1"><p style="font-weight:700">What changed</p><p>'+BOARDS[ch.board].name+' moved from '+TONES[ch.from].label+' to '+TONES[ch.to].label+'.</p><button class="linkbtn" data-act="dismiss">Got it</button></div></section>';
  }
  h+='<section aria-label="Your boards" class="stack" style="gap:12px">';
  BOARD_ORDER.forEach(function(b){
    var t=S.tone[b],c=COPY[b][t];
    h+='<button class="bcard b-'+b+'" data-act="tab" data-a="'+b+'" data-fid="card-'+b+'"><div class="bc-top"><span class="bname">'+BOARDS[b].name+'</span>'+toneChip(t,true)+'</div>'+
     '<p class="bc-sent">'+c.h+'</p><p class="bc-date">'+ic('cal',16)+sub(c.s,b)+'</p><span class="chev">'+ic('chev',20)+'</span></button>';
  });
  h+='</section>';
  h+='<section class="pair b-none"><div class="card"><p class="hd">'+ic('check',18)+'Good for</p>'+listHTML(['Finishing one small task','A short walk after lunch','Replying to a message you have been avoiding'],'you')+'</div>'+
     '<div class="card"><p class="hd">'+ic('pause',18)+'Better to wait</p>'+listHTML(['Big purchases','Hard conversations late in the day'],'you','pause')+'</div></section>';
  h+='<button class="askbar" data-act="tab" data-a="ask">'+ic('ask',20)+'Ask anything about your life</button>';
  h+='</div>';
  return h;
}

function segHTML(b){
  var pages=[['now','Now'],['back','Looking back'],['ahead','Ahead'],['worries','Worries']];
  return '<div class="seg" role="tablist" aria-label="'+BOARDS[b].name+' pages">'+pages.map(function(p){
    var on=S.page[b]===p[0];
    return '<button role="tab" aria-selected="'+on+'" data-act="page" data-a="'+b+'" data-b="'+p[0]+'" data-fid="seg-'+p[0]+'">'+p[1]+'</button>';
  }).join('')+'</div>';
}

function boardView(b){
  var pg=S.page[b],body='';
  if(pg==='now')body=nowPage(b);else if(pg==='back')body=backPage(b);else if(pg==='ahead')body=aheadPage(b);else body=worriesPage(b);
  return topBar(BOARDS[b].name,'Thursday 5 Nov')+segHTML(b)+'<div role="tabpanel">'+body+'</div>';
}

function whyLink(b){return '<div><button class="linkbtn" data-act="why" data-a="'+b+'">'+ic('info',18)+'Why we think so</button></div>';}
function actionCard(b){
  var c=C(b),on=!!S.acted[b+S.tone[b]];
  return '<section class="card"><p class="k">One thing to do</p><p style="margin-bottom:14px">'+sub(c.a,b)+'</p><button class="btn-primary" data-act="action" data-a="'+b+'" aria-pressed="'+on+'">'+(on?ic('check',18)+'Added to your week':c.btn)+'</button></section>';
}
function pairCards(b,title){
  var c=C(b);
  return '<section class="pair" aria-label="'+(title||'This week')+'"><div class="card"><p class="k">'+(title||'This week')+'</p><p class="hd">'+ic('check',18)+'Good for</p>'+listHTML(c.good,b)+'</div>'+
   '<div class="card"><p class="hd">'+ic('pause',18)+'Better to wait</p>'+listHTML(c.wait,b,'pause')+'</div></section>';
}
function mainWorry(b){
  var t=S.tone[b],w=wOf(b,MAINW[b][t]);
  return '<section class="card"><p class="k">On your mind</p><button class="rowbtn" style="border:0;min-height:48px;padding:0" data-act="worry" data-a="'+b+'" data-b="'+w.id+'"><span class="rcol"><span class="rq">'+w.q+'</span><span class="chip">'+ic(w.kind==='open'?'okc':w.kind==='waiting'?'wait':'none',16)+sub(pick(w.chip,t),b)+'</span></span>'+ic('chev',20)+'</button></section>';
}
function chartBlock(b){
  if(!(S.chart&&b==='work'))return '';
  return '<section class="card chartd" data-exempt="1"><h3 class="sub-h">Chart details</h3><p class="meta">For astrologers. Example only, shown because Chart details is on.</p><dl>'+
   CHART_DETAILS.map(function(r){return '<div><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>';}).join('')+'</dl></section>';
}
function toneHead(b,t){
  var c=C(b);
  return '<section><div>'+toneChip(t)+'</div><h2 class="headline">'+c.h+'</h2><p class="lede">'+sub(c.n,b)+'</p><p class="meta" style="margin-top:8px">Confidence: '+WHYC[t]+'. Updated today.</p></section>';
}
function calmLine(){return '<p class="meta" style="font-size:1em">If this is weighing on you, talking to someone helps. <button class="linkbtn" data-act="support" style="min-height:44px">Find support</button></p>';}
function afterCard(b){
  var r=RUNGS[S.tone[b]][1];
  return '<details class="card"><summary>What comes after</summary><p>'+sub(r.s,b,true)+'</p><button class="linkbtn" data-act="page" data-a="'+b+'" data-b="ahead">See what is ahead</button></details>';
}

function nowPage(b){
  var t=S.tone[b],c=C(b),D=BOARDS[b].d,h='<div class="stack enter">',n;
  h+=toneHead(b,t);
  if(t==='demanding'){
    h+='<section class="card"><p class="k">When it eases</p><p class="big">'+f(D.E)+'</p><p class="muted">'+inWhen(D.E).replace(/^in/,'In')+'. Until then, it is about getting through, not getting ahead.</p></section>';
    h+=actionCard(b);
    h+=pairCards(b);
    h+='<section class="card"><p class="k">What to protect</p>'+listHTML(c.protect,b)+'</section>';
    h+=mainWorry(b)+afterCard(b)+whyLink(b)+calmLine();
  }else if(t==='easing'){
    h+='<section class="card"><p class="k">From now to next</p><div class="steps"><div class="st now"><b><span class="dot"></span>Now</b><span class="muted">Still demanding, but lifting</span></div><span class="stline" aria-hidden="true"></span><div class="st"><b><span class="dot"></span>'+f(D.E)+'</b><span class="muted">A better time opens</span></div></div><p class="meta">That is '+inWhen(D.E)+'.</p></section>';
    h+='<section class="card"><p class="k">Before it opens</p>'+listHTML(c.before,b)+'</section>';
    h+=actionCard(b);
    h+=pairCards(b);
    h+=mainWorry(b)+afterCard(b)+whyLink(b)+calmLine();
  }else if(t==='steady'){
    h+='<section class="card"><p class="k">Next opening</p><p class="big">'+f(D.O)+'</p><p class="muted">That is '+inWhen(D.O)+'. Until then, build.</p></section>';
    var r1=RUNGS.steady[0],r2=RUNGS.steady[1];
    h+='<section class="card"><p class="k">The next 3 months</p><p style="margin-bottom:8px"><b>1 month.</b> '+sub(r1.s,b)+'</p><p style="margin-bottom:6px"><b>3 months.</b> '+sub(r2.s,b)+'</p><button class="linkbtn" data-act="page" data-a="'+b+'" data-b="ahead">See everything ahead</button></section>';
    h+='<section class="card"><p class="k">Small wins in the next 90 days</p>'+listHTML(c.wins,b)+'</section>';
    h+='<section class="card"><p class="k">What is stable</p><p>'+c.stable+'</p></section>';
    h+=actionCard(b)+pairCards(b)+mainWorry(b)+whyLink(b);
  }else{
    var closing=t==='closing',end=closing?D.C:D.OP;n=days(end);
    var ad=actDays(end);
    h+='<section class="card hero"><p class="k">'+(closing?'This window closes':'This window is open until')+'</p><p class="herodate">'+(closing?'Before ':'')+f(end)+'</p>'+
      '<div class="bar" role="img" aria-label="'+daysText(end)+' left"><span style="width:'+Math.min(100,Math.round(n/90*100))+'%"></span></div>'+
      '<p><b>'+daysText(end)+' left</b> to act.</p>'+(ad.length?'<p class="k" style="margin-top:12px">Best days to act</p><ul class="list">'+ad.map(function(d){return '<li>'+ic('cal',18)+'<span>'+wdDate(d)+'</span></li>';}).join('')+'</ul>':'')+'</section>';
    h+='<section class="card"><p class="k">'+(closing?'Finish before it closes':'What to ask for')+'</p>'+listHTML(closing?c.finish:c.ask,b)+'</section>';
    h+=actionCard(b)+pairCards(b);
    h+='<section class="card soft"><p class="k">After that</p><p>A slower stretch comes from '+f(plus(end,1))+'. Plan for it now so it never catches you out.</p></section>';
    h+=mainWorry(b)+whyLink(b);
  }
  h+=chartBlock(b);
  h+='</div>';
  return h;
}

function backPage(b){
  var L=LB[b],ck=S.checks[b],h='<div class="stack enter">';
  h+='<p class="meta">How your last two years looked, stretch by stretch. Only moments your chart supports are shown.</p>';
  L.ranges.forEach(function(r){
    h+='<section class="card rangecard"><p class="k">'+r.k+'</p><div>'+toneChip(r.t,true)+'</div><p style="font-weight:600">'+r.s+'</p></section>';
  });
  var answered=0,yes=0,partly=0,skipped=0,total=L.moments.length;
  L.moments.forEach(function(m){var a=ck[m.id];if(!a)return;if(a.a==='skip')skipped++;else{answered++;if(a.a==='yes')yes++;if(a.a==='partly')partly++;}});
  h+='<section class="card" aria-live="polite"><p class="confirmed">'+ic('okc',24)+'<span>'+(answered+skipped===0?'Answer a few and we will show how well this fits.':'You confirmed '+yes+' of '+answered+'.')+'</span></p>'+
     '<p class="meta" style="margin-top:6px">'+(answered+skipped===0?'It is your own count, not a score for us.':(partly?partly+' partly. ':'')+(skipped?skipped+' skipped. ':'')+'It is your own count, not a score for us.')+'</p></section>';
  h+='<h2 class="sub-h" style="margin-top:6px">Did these feel right?</h2>';
  L.moments.forEach(function(m){
    var a=ck[m.id]||{};
    h+='<article class="card"><p class="k">'+m.when+'</p><p class="q">'+m.q+'</p><div class="ans" role="group" aria-label="Your answer">'+
      ANS.map(function(x){return '<button class="btn-ghost" data-act="ans" data-a="'+b+'" data-b="'+m.id+'" data-c="'+x[0]+'" aria-pressed="'+(a.a===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>';
    if(a.a==='partly'||a.a==='no'){
      h+='<p class="meta" style="margin-top:12px">What was it like? (optional)</p><div class="notechips">'+NOTES.map(function(nt){return '<button class="btn-ghost" data-act="note" data-a="'+b+'" data-b="'+m.id+'" data-c="'+nt+'" aria-pressed="'+(a.note===nt)+'">'+nt+'</button>';}).join('')+'</div>';
    }
    if(a.a)h+='<p class="meta" style="margin-top:12px">'+ic('lock',14).replace('<svg','<svg style="display:inline;vertical-align:-2px;margin-right:4px"')+'Saved privately. You can delete it in Settings.</p>';
    h+='</article>';
  });
  h+='</div>';
  return h;
}

function aheadPage(b){
  var t=S.tone[b],rs=RUNGS[t],h='<div class="stack enter">';
  h+='<p class="meta">Further out, we show less. A rung appears only when enough of your chart agrees.</p>';
  rs.forEach(function(r,i){
    if(r.hidden){
      h+='<section class="card rung hidden"><h3><span>'+RUNG_LABELS[i]+'</span></h3><p class="sent" style="margin-bottom:0">Nothing large is moving.</p></section>';
    }else{
      h+='<section class="card rung"><h3><span>'+RUNG_LABELS[i]+'</span><span class="chip">'+ic(r.c==='confirmed'?'okc':'wait',16)+r.c+'</span></h3><p class="sent">'+sub(r.s,b,true)+'</p>'+
        '<dl class="kv"><dt>Best window</dt><dd>'+sub(r.b,b,true)+'</dd><dt>Hardest stretch</dt><dd>'+sub(r.h,b,true)+'</dd></dl></section>';
    }
  });
  h+='<p class="meta">Nothing beyond two years is shown here.</p></div>';
  return h;
}

function worriesPage(b){
  var t=S.tone[b],h='<div class="stack enter"><p class="meta">The things people lose sleep over, with one answer each.</p><section class="card" style="padding-top:6px;padding-bottom:6px">';
  W[b].forEach(function(w){
    h+='<button class="rowbtn" data-act="worry" data-a="'+b+'" data-b="'+w.id+'" data-fid="w-'+w.id+'"><span class="rcol"><span class="rq">'+w.q+'</span><span class="chip">'+ic(w.kind==='open'?'okc':w.kind==='waiting'?'wait':'none',16)+sub(pick(w.chip,t),b)+'</span></span>'+ic('chev',20)+'</button>';
  });
  h+='</section></div>';
  return h;
}

function worryView(b,id){
  var w=wOf(b,id),t=S.tone[b],key=b+':'+id,ans=S.did[key];
  var kindLabel={open:'Open',waiting:'Waiting',not:'Not shown in your chart'}[w.kind];
  var h='<div class="top" style="margin-bottom:0"><button class="backbtn" data-act="closeWorry" aria-label="Back to '+BOARDS[b].name+' worries">'+ic('back',22)+BOARDS[b].name+'</button><div class="tools"><button class="iconbtn" data-act="settings" aria-label="Settings">'+ic('you',20)+'</button></div></div>';
  h+='<div class="stack enter"><h1 class="headline" style="margin-top:4px">'+w.q+'</h1>';
  h+='<section class="card"><p><span class="tonechip">'+ic(w.kind==='open'?'okc':w.kind==='waiting'?'wait':'none',18)+kindLabel+'</span></p><p class="lede" style="margin-top:12px;font-weight:600">'+sub(pick(w.verdict,t),b)+'</p></section>';
  h+='<section class="card"><p class="k">Window</p><p class="big" style="font-size:24px">'+sub(w.win,b)+'</p><p class="meta" style="margin-top:6px">Confidence: '+w.conf+'.</p></section>';
  h+='<section class="card"><p class="k">What helps</p>'+listHTML(w.helps,b)+'</section>';
  h+='<section class="card"><p class="k">Better to wait on</p>'+listHTML(w.wait,b,'pause')+'</section>';
  h+='<section class="card"><p class="k">Did this happen?</p><div class="ans" role="group" aria-label="Did this happen?">'+
    [['yes','Yes'],['partly','Partly'],['notyet','Not yet'],['wrong','Wrong date']].map(function(x){return '<button class="btn-ghost" data-act="did" data-a="'+key+'" data-b="'+x[0]+'" aria-pressed="'+(ans===x[0])+'">'+x[1]+'</button>';}).join('')+'</div>'+
    (ans?'<p class="meta" style="margin-top:12px">Thanks. Saved privately. You can delete it in Settings.</p>':'')+'</section>';
  h+='<div><button class="linkbtn" data-act="whyw" data-a="'+b+'" data-b="'+id+'">'+ic('info',18)+'Why we think so</button></div></div>';
  return h;
}

function askView(){
  var h=topBar('Ask','Thursday 5 Nov');
  h+='<p class="muted">Ask anything about your life. Answers point to a board, such as Work, Worries.</p>';
  h+='<div class="sugg">'+[['work','job-hold'],['love','fighting'],['you','becoming']].map(function(x){var w=wOf(x[0],x[1]);return '<button class="btn-ghost" data-act="askchip" data-a="'+x[0]+'" data-b="'+x[1]+'">'+ic('ask',18)+w.q+'</button>';}).join('')+'</div>';
  h+='<div class="chat" aria-live="polite">';
  S.asks.forEach(function(m){h+='<div class="bubble'+(m.me?' me':'')+'">'+m.t+'</div>';});
  h+='</div>';
  h+='<form class="askform" id="askform"><input id="askinput" type="text" placeholder="Ask anything about your life" aria-label="Ask anything about your life" autocomplete="off"><button class="btn-primary" type="submit" aria-label="Send">'+ic('send',22)+'</button></form>';
  return h;
}

/* ---------- sheets ---------- */
function sheetHTML(title,body){
  return '<div class="backdrop" data-act="sheetClose"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT"><div class="grab"></div><div class="sh-head"><h2 id="sheetT">'+title+'</h2><button class="iconbtn plain" data-act="sheetClose" data-fid="sheet-x" aria-label="Close">'+ic('x',22)+'</button></div><div class="sh-body">'+body+'</div></section>';
}
function settingsBody(){
  var th=[['auto','Auto'],['light','Light'],['dark','Dark']];
  return '<div class="setrow" style="flex-direction:column;align-items:stretch"><p style="font-weight:700">Theme</p><div class="mchips" role="radiogroup" aria-label="Theme">'+th.map(function(x){return '<button class="mchip" role="radio" aria-checked="'+(S.themePref===x[0])+'" data-act="setTheme" data-a="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div></div>'+
   '<div class="setrow"><div><p id="cdl" style="font-weight:700">Show chart details</p><p class="meta">For astrologers. Adds technical detail to the Work page.</p></div><button class="switch" role="switch" aria-checked="'+S.chart+'" aria-labelledby="cdl" data-act="toggleChart"><span class="knob"></span>'+(S.chart?'On':'Off')+'</button></div>'+
   '<div class="setrow"><div><p style="font-weight:700">Your answers</p><p class="meta">Private to you. Delete them any time.</p></div><button class="btn-ghost" data-act="clearAnswers">Delete my answers</button></div>';
}
function sheetContent(){
  var sh=S.sheet;if(!sh)return '';
  if(sh.type==='why')return sheetHTML('Why we think so',whyBody(sh.b,S.tone[sh.b]));
  if(sh.type==='whyw'){var w=wOf(sh.b,sh.id);
    var items=w.why.map(function(s){return '<li>'+ic('check',18)+'<span>'+sub(s,sh.b)+'</span></li>';}).join('');
    return sheetHTML('Why we think so','<p>Here is what we looked at, in plain words.</p><ul class="list">'+items+'</ul><p class="meta">Confidence: '+w.conf+'. We only show a date when our records support it.</p>');}
  if(sh.type==='settings')return sheetHTML('Settings',settingsBody());
  if(sh.type==='support')return sheetHTML('Talking helps','<p>You do not have to carry this alone. A friend, someone in your family or a counsellor can listen without judging.</p><p class="meta">In the real app, this page lists support lines for your country.</p>');
  return '';
}

/* ---------- tab bar, mock panel ---------- */
var TABS=[['today','Today','b-none'],['you','You','b-you'],['love','Love','b-love'],['work','Work','b-work'],['ask','Ask','b-none']];
function tabbarHTML(){
  return TABS.map(function(t){
    var on=(S.tab===t[0]);
    return '<button class="tab '+t[2]+'"'+(on?' aria-current="page"':'')+' data-act="tab" data-a="'+t[0]+'" data-fid="tab-'+t[0]+'">'+ic(t[0],24)+t[1]+'</button>';
  }).join('');
}
function mockHTML(){
  var b=S.sel,t=S.tone[b];
  function chips(items,cur,act,lbl){return '<div class="mchips" role="radiogroup" aria-label="'+lbl+'">'+items.map(function(x){return '<button class="mchip" role="radio" aria-checked="'+(cur===x[0])+'" data-act="'+act+'" data-a="'+x[0]+'" data-fid="'+act+'-'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>';}
  return '<div class="mrow"><p class="mlabel">Board</p>'+chips(BOARD_ORDER.map(function(x){return [x,BOARDS[x].name];}),b,'selBoard','Board')+'</div>'+
   '<div class="mrow"><p class="mlabel">Tone</p>'+chips(TONE_ORDER.map(function(x){return [x,TONES[x].label];}),t,'selTone','Tone')+'</div>'+
   '<div class="mrow"><p class="mlabel">Theme</p>'+chips([['auto','Auto'],['light','Light'],['dark','Dark']],S.themePref,'setTheme','Theme')+'</div>'+
   '<p class="mnote">'+BOARDS[b].name+' shows the <b>'+LAYOUT_NAME[TONES[t].layout]+'</b> layout.</p>'+
   '<p class="mnote">Today shows: '+BOARD_ORDER.map(function(x){return BOARDS[x].name+' '+TONES[S.tone[x]].label;}).join(', ')+'.</p>';
}

/* ---------- render ---------- */
function render(nav){
  var prevTop=$screen.scrollTop;
  var b=curBoard(),lay=curLayout();
  $screen.className='screen lay-'+lay+(b?' b-'+b:' b-none');
  var html;
  if(S.worry)html=worryView(S.worry.board,S.worry.id);
  else if(S.tab==='today')html=todayView();
  else if(S.tab==='ask')html=askView();
  else html=boardView(S.tab);
  $screen.innerHTML=html;
  if(nav){
    $screen.scrollTop=0;
    var kids=$screen.querySelectorAll('.stack');
    for(var i=0;i<kids.length;i++){if(!kids[i].classList.contains('enter'))kids[i].classList.add('enter');}
  }else $screen.scrollTop=prevTop;
  $tabbar.innerHTML=tabbarHTML();
  var sc=sheetContent();
  $overlay.className='overlay'+(sc?' on':'')+(lay==='support'?' nomo':'');
  $overlay.innerHTML=sc;
  $mock.innerHTML=mockHTML();
  applyTheme();
  // focus management
  if(S.sheet&&!S.sheetFocused){var x=$overlay.querySelector('[data-fid="sheet-x"]');if(x){x.focus();S.sheetFocused=true;}}
  else if(S.focusKey){
    var els=document.querySelectorAll('[data-fid]');
    for(var j=0;j<els.length;j++){if(els[j].getAttribute('data-fid')===S.focusKey){els[j].focus({preventScroll:true});break;}}
  }
  scanBanned(true);
}

/* ---------- banned-word self-check ---------- */
var BANNED_PREFIX=['storm','hurricane','flood','weather','season','forecast','hospital','emergency','urgent','triage','resort','lobby','guaranteed','certain','safe','dasha','nakshatra','house','lord','trine','square','transit','retrograde','saturn','jupiter','venus','mercury','rahu','ketu'];
var RE_PREFIX=new RegExp('\\b(?:'+BANNED_PREFIX.join('|')+')\\w*','gi');
var RE_EXACT=/\b(?:sun|moon|mars)\b/gi;
var RE_ER=/\bER\b/g;
var RE_D=/\bD(?:10|9)\b/gi;
function scanBanned(log){
  var found=[];
  var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null);
  var n;
  function check(txt,where){
    [RE_PREFIX,RE_EXACT,RE_ER,RE_D].forEach(function(re){
      re.lastIndex=0;var m;
      while((m=re.exec(txt))){found.push({word:m[0],where:where});}
    });
  }
  while((n=w.nextNode())){
    var p=n.parentNode;
    if(!p||p.nodeName==='SCRIPT'||p.nodeName==='STYLE')continue;
    if(p.closest&&p.closest('[data-exempt]'))continue;
    check(n.nodeValue,(txtCtx(p)));
  }
  var attrs=document.body.querySelectorAll('[aria-label],[title],[placeholder],[alt]');
  for(var i=0;i<attrs.length;i++){
    if(attrs[i].closest('[data-exempt]'))continue;
    ['aria-label','title','placeholder','alt'].forEach(function(a){var v=attrs[i].getAttribute(a);if(v)check(v,a+': '+v);});
  }
  window.__banned=found;
  if(log&&found.length)found.forEach(function(x){console.warn('Banned word "'+x.word+'" found in: '+x.where);});
  return found;
}
function txtCtx(p){return (p.textContent||'').trim().slice(0,80);}

/* ---------- actions ---------- */
function openSheet(s,opener){S.sheet=s;S.sheetFocused=false;S.opener=opener||null;}
function closeSheet(){S.sheet=null;S.sheetFocused=false;S.focusKey=S.opener;S.opener=null;}
function keyOf(el){return el.getAttribute('data-fid')||null;}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),a=el.getAttribute('data-a'),bb=el.getAttribute('data-b'),cc=el.getAttribute('data-c');
  var nav=false;
  S.focusKey=keyOf(el);
  switch(act){
    case 'tab':
      S.tab=a;S.worry=null;S.sheet=null;
      if(BOARD_ORDER.indexOf(a)>-1)S.sel=a;
      nav=true;break;
    case 'page':S.page[a]=bb;S.worry=null;nav=true;break;
    case 'worry':S.worry={board:a,id:bb};nav=true;S.focusKey=null;break;
    case 'closeWorry':{var bd=S.worry.board,id=S.worry.id;S.worry=null;nav=true;S.focusKey='w-'+id;break;}
    case 'why':openSheet({type:'why',b:a},keyOf(el));break;
    case 'whyw':openSheet({type:'whyw',b:a,id:bb},keyOf(el));break;
    case 'settings':openSheet({type:'settings'},null);break;
    case 'support':openSheet({type:'support'},null);break;
    case 'sheetClose':closeSheet();break;
    case 'theme':S.themePref=effDark()?'light':'dark';break;
    case 'setTheme':S.themePref=a;break;
    case 'toggleChart':S.chart=!S.chart;break;
    case 'clearAnswers':S.checks={you:{},love:{},work:{}};S.did={};break;
    case 'dismiss':S.changed=null;S.focusKey=null;break;
    case 'action':{var k=a+S.tone[a];S.acted[k]=!S.acted[k];break;}
    case 'ans':{var cur=S.checks[a][bb]||{};S.checks[a][bb]={a:cc,note:(cc==='partly'||cc==='no')?cur.note:undefined};break;}
    case 'note':{var c2=S.checks[a][bb];if(c2)c2.note=(c2.note===cc?undefined:cc);break;}
    case 'did':S.did[a]=(S.did[a]===bb?undefined:bb);break;
    case 'selBoard':S.sel=a;S.tab=a;S.worry=null;S.page[a]='now';nav=true;S.focusKey='selBoard-'+a;break;
    case 'selTone':{var bsel=S.sel,old=S.tone[bsel];if(old!==a){S.changed={board:bsel,from:old,to:a};}S.tone[bsel]=a;
      if(BOARD_ORDER.indexOf(S.tab)===-1){S.tab=bsel;S.page[bsel]='now';S.worry=null;nav=true;}
      break;}
    case 'askchip':S.tab=a;S.sel=a;S.page[a]='worries';S.worry={board:a,id:bb};nav=true;S.focusKey=null;break;
  }
  render(nav);
});

document.addEventListener('submit',function(e){
  if(e.target.id!=='askform')return;
  e.preventDefault();
  var inp=document.getElementById('askinput'),v=(inp.value||'').trim();
  if(!v)return;
  S.asks.push({me:true,t:v.replace(/</g,'&lt;')});
  S.asks.push({me:false,t:'In the real app, your answer appears here. It points to a board, for example Work, Worries.'});
  S.focusKey=null;
  render(false);
  var ni=document.getElementById('askinput');if(ni)ni.focus();
  $screen.scrollTop=$screen.scrollHeight;
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.sheet){closeSheet();render(false);}
});

/* mock panel starts closed on a phone */
if(window.matchMedia&&window.matchMedia('(max-width:760px)').matches)document.getElementById('mockd').removeAttribute('open');
if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');var cb=function(){if(S.themePref==='auto')render(false);};if(mq.addEventListener)mq.addEventListener('change',cb);}

/* sweep: open every screen state once and report banned words (used for checking) */
window.__mock={
  state:S,
  scan:scanBanned,
  sweep:function(){
    var out=[],save=JSON.stringify({tab:S.tab,sel:S.sel,sheet:S.sheet,worry:S.worry,chart:S.chart});
    function chk(label){render(true);var r=scanBanned(false);if(r.length)out.push({at:label,hits:r});}
    S.chart=true;
    chk('today');S.tab='ask';chk('ask');
    BOARD_ORDER.forEach(function(b){
      TONE_ORDER.forEach(function(t){
        var oldTone=S.tone[b];S.tone[b]=t;S.tab=b;S.sel=b;
        ['now','back','ahead','worries'].forEach(function(p){S.page[b]=p;S.worry=null;S.sheet=null;chk(b+'/'+t+'/'+p);});
        S.sheet={type:'why',b:b};chk(b+'/'+t+'/why-sheet');S.sheet=null;
        S.sheet={type:'support'};chk(b+'/'+t+'/support-sheet');S.sheet=null;
        W[b].forEach(function(w){S.worry={board:b,id:w.id};chk(b+'/'+t+'/worry/'+w.id);S.sheet={type:'whyw',b:b,id:w.id};chk(b+'/'+t+'/worry/'+w.id+'/why');S.sheet=null;});
        S.worry=null;
        S.tone[b]=oldTone;
      });
    });
    S.sheet={type:'settings'};chk('settings');S.sheet=null;
    var s=JSON.parse(save);S.tab=s.tab;S.sel=s.sel;S.sheet=null;S.worry=s.worry;S.chart=s.chart;
    render(false);
    return out;
  }
};

render(true);
})();
</script>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky times</title>
<meta name="description" content="Mockup of the Lucky times board (doc 47): Today, Week and Month views with sample data for San Jose, Thu 5 Nov 2026.">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#0b0a1f; --surface:#15143a; --surface-2:#1f1e4c; --text:#f4f2ff; --muted:#aaa7cb;
  --border:rgba(255,255,255,.13); --border-strong:rgba(255,255,255,.28);
  --go:#2ec4a0; --go-tint:rgba(46,196,160,.20); --go-ink:#eafff8;
  --avoid:#e3a94e; --avoid-tint:rgba(227,169,78,.08); --avoid-stripe:rgba(227,169,78,.42);
  --neutral:rgba(255,255,255,.05);
  --accent:#a78bfa; --grad:linear-gradient(90deg,#8b5cf6 0%,#ec4899 100%);
  --now:#ff4d4f; --good:#34d399; --steady:#7aa7ff; --careful:#f5b942;
  --radius:14px; --radius-s:10px; --shadow:0 12px 36px rgba(0,0,0,.40);
  --focus:#c4b5fd; --hour:44px;
}
:root[data-theme="light"]{
  --bg:#f6f5fb; --surface:#ffffff; --surface-2:#efedf8; --text:#16152e; --muted:#5e5c7a;
  --border:rgba(20,18,60,.12); --border-strong:rgba(20,18,60,.28);
  --go:#0f9f7d; --go-tint:rgba(15,159,125,.14); --go-ink:#063b2f;
  --avoid:#b8791b; --avoid-tint:rgba(184,121,27,.06); --avoid-stripe:rgba(184,121,27,.38);
  --neutral:rgba(20,18,60,.04);
  --accent:#7c3aed; --now:#e5484d; --good:#15803d; --steady:#2563eb; --careful:#b45309;
  --shadow:0 12px 36px rgba(20,18,60,.18); --focus:#7c3aed;
}
@media (min-width:820px){ :root{ --hour:48px; } }
@media (min-width:1100px){ :root{ --hour:52px; } }

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1280px;margin:0 auto;padding:12px 16px 40px}
.ic{width:1.1em;height:1.1em;vertical-align:-0.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.big{width:1.5em;height:1.5em}
.muted{color:var(--muted)}
.small{font-size:15px}
.tiny{font-size:13px}

/* ---------- header ---------- */
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:6px 0 10px}
.hdr h1{
  margin:0;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-0.02em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1 1 auto;
}
.hdr .ctl{display:flex;gap:8px;align-items:center}
.place{
  height:44px;min-width:44px;padding:0 36px 0 14px;border-radius:12px;border:1px solid var(--border-strong);
  background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23aaa7cb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 10px center/18px;
  color:var(--text);font-size:16px;font-weight:600;appearance:none;-webkit-appearance:none;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;min-width:44px;padding:0 14px;
  border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:16px;
}
.btn.primary{border:0;background:var(--grad);color:#fff}
.btn.ghost{border-color:transparent}

/* ---------- segmented control ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--border);margin:6px 0 14px}
.seg button{height:44px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong)}
@media (min-width:820px){ .seg{max-width:420px} }

/* ---------- cards & chips ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:14px;font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.state{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.state.good{color:var(--good)} .state.steady{color:var(--steady)} .state.careful{color:var(--careful)}
.state.go{color:var(--go)} .state.avoid{color:var(--avoid)} .state.neutral{color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.good{background:var(--good)} .dot.steady{background:var(--steady)} .dot.careful{background:var(--careful)}

/* ---------- today ---------- */
.now{display:flex;gap:14px;align-items:flex-start}
.now .big{font-size:22px;font-weight:700;line-height:1.25;margin:0}
.now .left{font-size:15px;color:var(--muted);margin-top:4px}
.banner h2{margin:0 0 4px;font-size:24px;line-height:1.2;letter-spacing:-0.01em}
.banner .meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin:8px 0;font-size:15px;color:var(--muted)}
.banner .meta span{display:inline-flex;align-items:center;gap:6px}
.banner .pl{margin:4px 0}
.banner .personal{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}

.timeline{list-style:none;margin:16px 0 0;padding:0}
.timeline li{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:stretch;margin-bottom:8px}
.timeline .t{font-size:13px;color:var(--muted);padding-top:10px;line-height:1.3}
.win{
  width:100%;text-align:left;min-height:56px;border-radius:var(--radius-s);padding:10px 12px;
  border:1px solid var(--border);background:var(--neutral);display:flex;flex-direction:column;gap:6px;
  transition:transform .2s ease;
}
.win:active{transform:scale(.995)}
.win.go{background:var(--go-tint);border-color:var(--go);border-left-width:5px}
.win.avoid{
  background:var(--avoid-tint) repeating-linear-gradient(135deg,transparent 0 7px,var(--avoid-stripe) 7px 9px);
  border-color:var(--avoid);border-style:dashed;
}
.win.neutral{min-height:44px}
.win .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.win .lbl{font-weight:700}
.win .why{font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0 0;font-size:14px;color:var(--muted)}
.legend .sw{display:inline-block;width:22px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--border)}
.legend .sw.go{background:var(--go-tint);border-color:var(--go)}
.legend .sw.avoid{background:var(--avoid-tint) repeating-linear-gradient(135deg,transparent 0 4px,var(--avoid-stripe) 4px 6px);border-color:var(--avoid)}
.legend .sw.neutral{background:var(--neutral)}

.strip{display:none}
@media (min-width:1100px){
  .today-layout{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
  .today-layout .colL{position:sticky;top:12px}
  .strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:0 0 14px}
  .strip button{min-height:64px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
  .strip button[aria-current="date"]{box-shadow:inset 0 0 0 2px var(--accent)}
  .strip .d{font-weight:700}
  .strip .s{font-size:13px;color:var(--muted)}
}

/* ---------- week ---------- */
.week-layout{display:block}
@media (min-width:1100px){ .week-layout{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start} }
.wgrid{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.whead{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border)}
@media (min-width:820px){ .whead,.wbody{grid-template-columns:52px repeat(7,minmax(0,1fr))!important} }
.whead .dh{min-width:0;overflow:hidden;padding:8px 2px;text-align:center;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;line-height:1.2}
.whead .dh .n{font-weight:700;font-size:13px;white-space:nowrap}
@media (min-width:820px){ .whead .dh .n{font-size:15px} }
.whead .dh[aria-current="date"] .n{color:var(--accent)}
.whead .dh .cw{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wbody{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr));position:relative}
.col{min-width:0}
.gut{position:relative;height:calc(var(--hour) * 16)}
.gut span{position:absolute;right:4px;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.col{position:relative;height:calc(var(--hour) * 16);border-left:1px solid var(--border);
  background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--hour) - 1px),var(--border) calc(var(--hour) - 1px) var(--hour))}
.band{position:absolute;left:2px;right:2px;border-radius:6px;border:1px solid var(--border);background:var(--neutral);
  display:flex;align-items:flex-start;padding:2px 4px;overflow:hidden;font-size:11px;line-height:1.2;text-align:left}
.band::after{content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px} /* extends the touch area */
.band.go{background:var(--go-tint);border-color:var(--go)}
.band.avoid{background:var(--avoid-tint) repeating-linear-gradient(135deg,transparent 0 5px,var(--avoid-stripe) 5px 7px);border-color:var(--avoid);border-style:dashed}
.band.neutral{display:none}
.band .bl{display:none;font-weight:600}
@media (min-width:820px){ .band .bl{display:block} .band{padding:3px 6px;font-size:12px} }
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.nowline span{position:absolute;right:2px;top:-16px;font-size:10px;color:var(--now);font-weight:700}
.area-list h3{margin:0 0 8px;font-size:20px}
.area{padding:10px 0;border-top:1px solid var(--border)}
.area:first-of-type{border-top:0}
.area h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
.area ol{list-style:none;margin:0;padding:0}
.area li{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:6px 0;font-size:15px;align-items:baseline}
.area li .w{font-weight:600;white-space:nowrap}
.area li .y{color:var(--muted)}

/* ---------- month ---------- */
.mhead{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;color:var(--muted);padding:6px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{
  min-width:0;overflow:hidden;min-height:56px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:6px 2px;
}
.day[aria-current="date"]{box-shadow:inset 0 0 0 2px var(--accent)}
.day .num{font-weight:700;font-size:15px}
.day .ob{font-size:11px;color:var(--muted);line-height:1.1;display:flex;align-items:center;gap:3px;max-width:100%}
.day .ob span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:768px){ .day .ob span{white-space:normal} }
.day .word{display:none}
.day .bars{display:none}
@media (min-width:768px){
  .day{min-height:96px;align-items:flex-start;padding:8px 8px}
  .day .word{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
  .day .dot{display:none}
  .day .bars{display:flex;flex-direction:column;gap:3px;width:100%;margin-top:auto}
  .bar{height:18px;border-radius:5px;background:var(--go-tint);border-left:3px solid var(--go);font-size:11px;padding:0 6px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
}
.mnote{margin:12px 0 0;font-size:15px;color:var(--muted)}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(5,4,20,.55);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;z-index:21;
  background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:20px 20px 0 0;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow);
  transform:translateY(calc(100% + 48px));visibility:hidden;
  transition:transform .28s ease,visibility 0s linear .28s;max-height:85vh;overflow:auto;
}
.sheet.open{transform:translateY(0);visibility:visible;transition:transform .28s ease,visibility 0s}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:0 auto 10px}
.sheet h2{margin:0;font-size:22px;line-height:1.2;padding-right:52px}
.sheet .sub{color:var(--muted);margin:2px 0 10px}
.sheet .x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:12px}
.sheet dl{margin:12px 0 0;display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:15px}
.sheet dt{color:var(--muted)}
.sheet dd{margin:0}
.sheet .src{margin-top:14px;font-size:14px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px}
.sheet .actions{margin-top:14px;display:flex;justify-content:flex-end}
@media (min-width:820px){ .sheet{bottom:24px;border-radius:20px;border-bottom:1px solid var(--border)} }

footer{margin-top:28px;font-size:14px;color:var(--muted);text-align:center}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

    </div>

  <div class="seg" role="tablist" aria-label="View">

    <button role="tab" type="button" data-view="month" aria-selected="false" aria-controls="view">Month</button>

  <main id="view" role="tabpanel"></main>

  <footer id="foot"></footer>
  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
</div>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="why" role="dialog" aria-modal="true" aria-labelledby="whyTitle" aria-hidden="true" tabindex="-1">

</section>

/* ---------- state ---------- */

function dateInfo(key){
  const d = new Date(key+'T12:00:00');
  return { dow:DOW[d.getDay()], day:d.getDate(), mon:MONTH_NAMES[d.getMonth()], year:d.getFullYear(), label:DOW[d.getDay()]+' '+d.getDate()+' '+MONTH_NAMES[d.getMonth()]+' '+d.getFullYear() };
}
function dayFor(key){ return DAYS[key] || Object.assign({}, DAYS[TODAY_KEY], {sample:true}); }

/* ---------- renderers ---------- */
function renderToday(){
  const P = PLACES[state.place];
  const d = dayFor(state.date);
  const di = dateInfo(state.date);
  const isToday = state.date===TODAY_KEY;
  const rise = state.place==='sanjose' ? d.rise : P.rise;
  const set  = state.place==='sanjose' ? d.set  : P.set;

  let nowCard = '';
  if(isToday){
    const cur = d.windows.find(w=> NOW_MIN>=toMin(w.from) && NOW_MIN<toMin(w.to));
    const left = cur ? toMin(cur.to)-NOW_MIN : 0;
    let line, kind='neutral', ic='minus';
    if(cur && cur.kind==='go'){ kind='go'; ic='check'; line='Right now: a good window for '+cur.areas.slice(0,2).map(a=>a.toLowerCase()).join(' and '); }
    else if(cur && cur.kind==='avoid'){ kind='avoid'; ic='pause'; line='Right now: better to wait until '+cur.to; }
    else { line='Right now: a quiet stretch, nothing to avoid'; }
    nowCard = '<section class="card now" aria-label="Right now">'+
      '<span class="state '+kind+'">'+icon(ic,'big')+'</span>'+
      '<div><p class="big">'+esc(line)+'</p><p class="left">'+(cur?fmtLeft(left)+' left · until '+cur.to:'')+' · '+KIND[kind].word+'</p></div></section>';
  } else {
    nowCard = '<section class="card now" aria-label="Chosen day"><span class="state neutral">'+icon('clock','big')+'</span>'+
      '<div><p class="big">Showing '+esc(di.label)+'</p><p class="left">'+(d.sample?'Sample windows shown for this date. ':'')+'</p>'+
      '<p style="margin:10px 0 0"><button class="btn primary" type="button" id="backToday">'+icon('back')+'Back to today</button></p></div></section>';
  }

  const banner = '<section class="card banner" aria-label="The day">'+
    '<h2>'+esc(di.label)+'</h2>'+
    '<div class="meta">'+
      '<span>'+icon('pin')+esc(P.name)+' · '+esc(P.zone)+' ('+esc(P.off)+')</span>'+
      '<span>'+icon('sunrise')+'Sunrise '+rise+' – sunset '+set+'</span>'+
      '<span>'+icon('moon')+esc(d.moon)+'</span>'+
    '</div>'+
    '<p class="pl">'+esc(d.p1)+'</p>'+
    '<p class="pl">'+esc(d.p2)+'</p>'+
    '<p class="pl">Day colour: '+colourWord(d.colour)+'</p>'+
    '<p class="personal"><span class="tag">For you</span>'+esc(d.personal)+'</p>'+
    (state.place!=='sanjose' ? '<p class="note">Windows below are the San Jose sample; sunrise and sunset are '+esc(P.name)+'’s.</p>' : '')+
  '</section>';

  const list = '<ol class="timeline" aria-label="Windows from 05:00 to 23:00">'+ d.windows.map((w,i)=>{
    const k = KIND[w.kind];
    return '<li><div class="t">'+w.from+'<br>'+w.to+'</div>'+
      '<button class="win '+w.kind+'" type="button" data-win="'+i+'" aria-label="'+esc(w.from+' to '+w.to+', '+k.word+(w.areas.length?' '+w.areas.join(', '):'')+', '+w.label+'. Opens why.')+'">'+
      '<span class="row"><span class="lbl"><span class="state '+w.kind+'">'+icon(k.icon)+'</span> '+esc(w.label)+'</span><span class="why">'+icon('info')+'Why</span></span>'+
      (w.kind!=='avoid' && w.areas.length ? '<span class="row"><span class="tiny muted">'+k.word+'</span>'+areaChips(w.areas)+'</span>' : (w.kind==='avoid'?'<span class="tiny muted">'+k.word+' · until '+w.to+'</span>':''))+
      '</button></li>';
  }).join('') + '</ol>'+
  '<div class="legend"><span><span class="sw go"></span>'+icon('check')+' Good for</span><span><span class="sw avoid"></span>'+icon('pause')+' Better to wait</span><span><span class="sw neutral"></span>'+icon('minus')+' Quiet choice</span></div>';

  const strip = '<div class="strip" role="group" aria-label="This week">'+ WEEK_KEYS.map(k=>{
    const x=DAYS[k]; return '<button type="button" data-date="'+k+'"'+(k===state.date?' aria-current="date"':'')+'><span class="d">'+x.dow+' '+x.n+'</span><span class="s">'+colourWord(x.colour)+'</span><span class="s">'+x.rise+' – '+x.set+'</span></button>';
  }).join('') + '</div>';

  return strip + '<div class="today-layout"><div class="colL">'+nowCard+banner+'</div><div>'+list+'</div></div>';
}

function renderWeek(){
  const START=6*60, END=22*60, SPAN=END-START;
  const head = '<div class="whead"><div class="dh" aria-hidden="true"></div>'+ WEEK_KEYS.map(k=>{
    const x=DAYS[k]; return '<div class="dh"'+(k===TODAY_KEY?' aria-current="date"':'')+'><span class="n">'+x.dow+' '+x.n+'</span><span class="cw"><span class="dot '+x.colour+'"></span>'+x.colour+'</span></div>';
  }).join('') + '</div>';
  let gut = '<div class="gut" aria-hidden="true">';
  for(let h=7;h<22;h++){ gut += '<span style="top:'+((h*60-START)/SPAN*100)+'%">'+String(h).padStart(2,'0')+'</span>'; }
  gut += '</div>';
  const cols = WEEK_KEYS.map(k=>{
    const x=DAYS[k];
    let out='<div class="col" role="group" aria-label="'+x.dow+' '+x.n+' Nov">';
    x.windows.forEach((w,i)=>{
      const a=Math.max(toMin(w.from),START), b=Math.min(toMin(w.to),END); if(b<=a) return;
      const kd=KIND[w.kind];
      out += '<button type="button" class="band '+w.kind+'" data-date="'+k+'" data-win="'+i+'" style="top:'+((a-START)/SPAN*100)+'%;height:'+((b-a)/SPAN*100)+'%" aria-label="'+esc(x.dow+' '+w.from+' to '+w.to+', '+kd.word+(w.areas.length?' '+w.areas.join(', '):'')+'. Opens why.')+'"><span class="bl">'+esc(w.kind==='avoid'?'Wait':w.areas.join(' · ')||w.label)+'</span></button>';
    });
    if(k===TODAY_KEY) out += '<div class="nowline" style="top:'+((NOW_MIN-START)/SPAN*100)+'%" aria-hidden="true"><span>now</span></div>';
    return out+'</div>';
  }).join('');
  const grid = '<div class="wgrid" aria-label="Week of 2 November 2026, 06:00 to 22:00">'+head+'<div class="wbody">'+gut+cols+'</div></div>'+
    '<div class="legend"><span><span class="sw go"></span>'+icon('check')+' Good for</span><span><span class="sw avoid"></span>'+icon('pause')+' Better to wait</span><span><span style="display:inline-block;width:22px;border-top:2px solid var(--now);vertical-align:middle;margin-right:6px"></span>now</span></div>';
  const list = '<section class="card area-list" aria-label="Lucky times this week"><h3>Lucky times this week</h3>'+ LUCKY.map(([area,rows])=>
    '<div class="area"><h4>'+icon(AREA_ICON[area])+area+'</h4><ol>'+rows.map(r=>'<li><span class="w">'+r[0]+' '+r[1].split('–')[0]+'</span><span><span class="small">'+r[1]+'</span><br><span class="y">'+esc(r[2])+'</span></span></li>').join('')+'</ol></div>'
  ).join('') + '</section>';
  return '<div class="week-layout"><div>'+grid+'</div><div>'+list+'</div></div>';
}

function renderMonth(){
  let cells='';
  for(let i=0;i<MONTH.length;i++){
    const n=i+1, key='2026-11-'+String(n).padStart(2,'0'), [c,best,ob]=MONTH[i];
    cells += '<button type="button" class="day" data-date="'+key+'"'+(key===TODAY_KEY?' aria-current="date"':'')+
      ' aria-label="'+esc(DOW[i%7]+' '+n+' November, '+c+(ob?', '+ob:'')+', best for '+best+'. Opens the day.')+'">'+
      '<span class="num">'+n+'</span><span class="dot '+c+'" aria-hidden="true"></span><span class="word state '+c+'">'+icon(COLOUR[c].icon)+c+'</span>'+
      (ob?'<span class="ob">'+icon('star')+'<span>'+esc(ob)+'</span></span>':'')+
      '<span class="bars"><span class="bar">'+icon(AREA_ICON[best.split(' ')[0]])+' '+esc(best)+'</span></span>'+
      '</button>';
  }
  return '<div class="toprow"><h2 style="margin:0;font-size:24px">November 2026</h2><span class="small muted">Tap a day to open it</span></div>'+
    '<div class="mhead" aria-hidden="true">'+DOW.map(d=>'<span>'+d+'</span>').join('')+'</div>'+
    '<div class="mgrid" role="group" aria-label="November 2026">'+cells+'</div>'+
    '<div class="legend"><span>'+colourWord('good')+'</span><span>'+colourWord('steady')+'</span><span>'+colourWord('careful')+'</span><span>'+icon('star')+' observance</span></div>'+
    '<p class="mnote">Dots are the day colour for you; the bar on wider screens is the best window of the day.</p>';
}

function render(){
  const v=$('#view');
  v.innerHTML = state.view==='today'?renderToday(): state.view==='week'?renderWeek(): renderMonth();
  document.querySelectorAll('.seg [role=tab]').forEach(b=> b.setAttribute('aria-selected', String(b.dataset.view===state.view)));
  const P=PLACES[state.place];
  $('#foot').textContent = 'Times for '+P.name+' · '+P.zone+' ('+P.off+')';
  const di=dateInfo(state.date);
  $('#live').textContent = 'Showing '+state.view+' view for '+(state.view==='today'?di.label:state.view==='week'?'the week of Mon 2 Nov 2026':'November 2026')+' in '+P.name;
  selfCheck();
}

/* ---------- why sheet ---------- */
let lastFocus=null;
function openWhy(dateKey, idx){
  const d=dayFor(dateKey), w=d.windows[idx], di=dateInfo(dateKey), k=KIND[w.kind];
  const rows=[];
  if(w.why.m) rows.push(['Muhurta',w.why.m]);
  if(w.why.h) rows.push(['Hora lord',w.why.h]);
  if(w.why.c) rows.push(['Choghadiya',w.why.c]);
  rows.push(['Tara bala', d.colour==='careful'?'Vipat (avoid big starts)':d.colour==='steady'?'Janma (intense)':'Sadhaka (good)']);
  rows.push(['Chandra bala', d.colour==='careful'?'8th from your Moon (chandrashtama)':d.colour==='steady'?'5th from your Moon (mixed)':'10th from your Moon (good)']);
  rows.push(['Moon’s house', d.colour==='good'?'10th — work':'4th — home and study']);
  rows.push(['Rule', w.kind==='avoid'?'An avoid band cuts every window it overlaps; it never fades.':w.kind==='go'?'A good muhurta or a suiting hora and choghadiya, outside every avoid band, scores the areas shown.':'Nothing to avoid, nothing that scores high: a quiet choice.']);
  $('#whyBody').innerHTML = '<h2 id="whyTitle">'+esc(w.label)+'</h2><p class="sub">'+esc(di.dow+' '+di.day+' '+di.mon)+' · '+w.from+'–'+w.to+' · <span class="state '+w.kind+'">'+icon(k.icon)+k.word+'</span></p>'+
    (w.areas.length?areaChips(w.areas):'')+
    '<dl>'+rows.map(r=>'<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>').join('')+'</dl>'+
    '<p class="src">Rules from Drik Panchang’s hora and choghadiya tables. Every time and name comes from a stored engine row for '+esc(PLACES[state.place].name)+'.</p>'+
    '<div class="actions"><button class="btn primary" type="button" id="whyDone">Done</button></div>';
  lastFocus=document.activeElement;
  $('#why').classList.add('open'); $('#backdrop').classList.add('open');
  $('#why').setAttribute('aria-hidden','false');
  $('#app').setAttribute('aria-hidden','true');
  $('#whyClose').focus();
  $('#whyDone').addEventListener('click', closeWhy);
}
function closeWhy(){
  $('#why').classList.remove('open'); $('#backdrop').classList.remove('open');
  $('#why').setAttribute('aria-hidden','true');
  $('#app').removeAttribute('aria-hidden');
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------- self-check: banned words in visible text outside the Why sheet ---------- */
const BANNED = /\b(sun|mars|mercury|jupiter|venus|saturn|rahu|ketu|tithi|nakshatra|horas?|choghadiya|muhurta|muhurat|dasha|mahadasha|antardasha|storm|hurricane|flood|blizzard|disaster|weather|season|forecast|hospital|emergency|urgent care|doctor|surgery|triage|guaranteed|certain|absolutely|100 ?%|safe|resort|vip|private jet|transit|retrograde|lord|house|lagna|yoga|karana|varjyam|gulika|yamaganda|abhijit|chandrashtama)\b/gi;
function selfCheck(){
  // Weekday abbreviations (Sun 8, Sun 18:42, the column head "Sun") are calendar words, not the planet: strip them first.
  const text = (($('#app').innerText||'') + ' ' + Array.from(document.querySelectorAll('#app option')).map(o=>o.textContent).join(' '))
    .replace(/\b(Sun|Mon|Tue|Wed|Thu|Fri|Sat)(?=\s*\d|\s*$)/gm,'');
  const hits = {}; let m;
  BANNED.lastIndex=0;
  while((m=BANNED.exec(text))){ hits[m[0].toLowerCase()]=(hits[m[0].toLowerCase()]||0)+1; }
  const keys=Object.keys(hits);
  if(keys.length) console.warn('[lucky-times self-check] banned words visible outside Why:', hits);
  else console.info('[lucky-times self-check] clean ('+state.view+')');
}

/* ---------- wiring ---------- */
const sel=$('#place');
Object.keys(PLACES).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=PLACES[k].name; sel.appendChild(o); });
sel.value=state.place;
sel.addEventListener('change', ()=>{ state.place=sel.value; render(); });

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  const b=$('#themeBtn'); const light=state.theme==='light';
  b.innerHTML = icon(light?'moon':'light')+'<span>'+(light?'Dark':'Light')+'</span>';
  b.setAttribute('aria-pressed', String(light));
  b.setAttribute('aria-label', light?'Switch to dark theme':'Switch to light theme');
}
$('#themeBtn').addEventListener('click', ()=>{ state.theme = state.theme==='light'?'dark':'light'; try{localStorage.setItem('lt-theme',state.theme);}catch(e){} applyTheme(); });

document.querySelectorAll('.seg [role=tab]').forEach(b=> b.addEventListener('click', ()=>{ state.view=b.dataset.view; render(); }));
$('.seg').addEventListener('keydown', e=>{
  const tabs=[...document.querySelectorAll('.seg [role=tab]')]; const i=tabs.findIndex(t=>t.getAttribute('aria-selected')==='true');
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length]; n.focus(); n.click(); }
});

$('#view').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='backToday'){ state.date=TODAY_KEY; render(); return; }
  if(b.dataset.win!==undefined){ openWhy(b.dataset.date||state.date, Number(b.dataset.win)); return; }
  if(b.dataset.date){ state.date=b.dataset.date; state.view='today'; render(); window.scrollTo({top:0}); return; }
});
$('#whyClose').addEventListener('click', closeWhy);
$('#backdrop').addEventListener('click', closeWhy);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#why').classList.contains('open')) closeWhy(); });

applyTheme();
render();
})();
</script>
